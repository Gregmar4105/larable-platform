name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /sites/larable-platform

    steps:
      - name: Fetch latest code
        run: git fetch origin

      - name: Reset to main
        run: git reset --hard origin/main

      - name: Install Composer dependencies
        run: composer install

      - name: Update Composer dependencies
        run: composer update

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Install Node dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Verify site endpoint
        run: curl -Iv larable-platform.test
